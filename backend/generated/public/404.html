<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>404 | Page Not Found</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      color: #ffffff;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .container {
      width: 100%;
      max-width: 600px;
      padding: 40px 24px;
      text-align: center;
    }

    .error-code {
      font-size: clamp(7rem, 20vw, 12rem);
      font-weight: 800;
      line-height: 0.9;
      letter-spacing: -0.08em;
      color: #ffffff;
    }

    .title {
      margin-top: 32px;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .description {
      margin: 12px auto 0;
      max-width: 420px;
      color: #888888;
      font-size: 1rem;
      line-height: 1.6;
    }

    .home-button {
      display: inline-block;
      margin-top: 32px;
      padding: 12px 22px;
      border-radius: 8px;
      background: #ffffff;
      color: #000000;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      transition: opacity 0.2s ease;
    }

    .home-button:hover {
      opacity: 0.8;
    }

    .brand {
      margin-top: 48px;
      color: #555555;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="error-code">404</div>

    <h1 class="title">Page not found</h1>

    <p class="description">
      The page you're looking for doesn't exist or may have been moved.
    </p>

    <!-- <a href="/" class="home-button">
      Go back home
    </a> -->

    <div class="brand">
      Distributed URL Shortener
    </div>
  </main>
</body>
</html>
