<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>{{STATUS_CODE}} | URL Error</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --background: #050505;
      --foreground: #f5f5f5;
      --muted: #8b8b8b;
      --border: rgba(255, 255, 255, 0.08);
      --card: rgba(255, 255, 255, 0.035);
      --accent: #ffffff;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(
          circle at 50% 35%,
          rgba(255, 255, 255, 0.06),
          transparent 32%
        ),
        var(--background);
      color: var(--foreground);
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      overflow: hidden;
    }

    /* Subtle background grid */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.25;
      background-image:
        linear-gradient(
          rgba(255, 255, 255, 0.025) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.025) 1px,
          transparent 1px
        );
      background-size: 48px 48px;
      mask-image: linear-gradient(
        to bottom,
        transparent,
        black 20%,
        black 80%,
        transparent
      );
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 620px;
      text-align: center;
      animation: fadeIn 0.5s ease-out;
    }

    .icon {
      width: 52px;
      height: 52px;
      margin: 0 auto 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--card);
      backdrop-filter: blur(12px);
    }

    .icon svg {
      width: 24px;
      height: 24px;
      stroke: #b5b5b5;
    }

    .status {
      font-size: clamp(7rem, 22vw, 13rem);
      font-weight: 800;
      line-height: 0.82;
      letter-spacing: -0.09em;
      color: #ffffff;
      text-shadow:
        0 0 40px rgba(255, 255, 255, 0.08);
      user-select: none;
    }

    .title {
      margin-top: 34px;
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    .message {
      margin: 14px auto 0;
      max-width: 440px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.7;
    }

    .actions {
      margin-top: 32px;
      display: flex;
      justify-content: center;
    }

    .home-button {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 12px 18px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      background: #ffffff;
      color: #050505;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 650;
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        opacity 0.2s ease;
    }

    .home-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(255, 255, 255, 0.12);
    }

    .home-button:active {
      transform: translateY(0);
    }

    .home-button svg {
      width: 16px;
      height: 16px;
    }

    .brand {
      margin-top: 54px;
      color: #4d4d4d;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 20px;
      }

      .status {
        font-size: 7rem;
      }

      .title {
        margin-top: 28px;
      }

      .brand {
        margin-top: 42px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .container {
        animation: none;
      }

      .home-button {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <div class="icon">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="9" />
        <path d="M12 8v4" />
        <path d="M12 16h.01" />
      </svg>
    </div>

    <div class="status">{{STATUS_CODE}}</div>

    <h1 class="title">
      Short URL unavailable
    </h1>

    <p class="message">
      {{MESSAGE}}
    </p>

    <div class="actions">
      <a href="/" class="home-button">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M19 12H5" />
          <path d="M12 19l-7-7 7-7" />
        </svg>

        Go back home
      </a>
    </div>

    <div class="brand">
      Distributed URL Shortener
    </div>

  </main>
</body>
</html>
