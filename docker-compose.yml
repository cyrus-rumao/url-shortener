services:
  backend:
    image: cyrumao117/url-backend:${IMAGE_TAG:-latest}
    container_name: url-backend-container
    restart: unless-stopped
    env_file:
      - .env.production.local
    ports:
      - "2000:2000"
    expose:
      - "2000"

  frontend:
    image: cyrumao117/url-frontend:${IMAGE_TAG:-latest}
    container_name: url-frontend-container
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: url-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

  prometheus:
    image: prom/prometheus:latest
    container_name: url-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend
volumes:
  pgdata:
